[project]
name = "veyra-agent-layer"
version = "0.1.0"
description = "Veyra agent layer: the AppSdk contract client, the gateway, and the talker/worker voice agent."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "agents/voice", "gateway"]
pythonpath = ["packages/common", "agents/voice", "gateway"]

[tool.setuptools.packages.find]
where = ["packages/common"]
