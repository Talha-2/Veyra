; Development PHP settings for the Veyra app layer.
;
; The opcache block is not a micro-optimisation here. The project is a Windows
; bind mount, and **one stat() of one file costs ~4.5 ms** across it (measured
; 2026-09-27: 300 stats = 1,350 ms). A request includes ~500 files, and the
; autoloader probes more, so anything that touches the filesystem per file per
; request costs seconds. Every setting below exists to make PHP stop asking the
; disk questions it already knows the answer to.

memory_limit = 512M
max_execution_time = 120

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; validate_timestamps=1 re-stats every cached file (revalidate_freq seconds
; after its last check) — which on this mount is 2–6 s per request, and made
; the contract's greeting-path route take 6 s. With it off, a cached file is
; served from shared memory with no stat at all: the same route takes ~50 ms.
;
; The trade: PHP source edits are invisible until `docker compose restart app`.
; When iterating on PHP, set OPCACHE_VALIDATE_TIMESTAMPS=1 in .env (the
; entrypoint writes it into zz-runtime.ini, which overrides this file) and
; accept the slow requests while you work.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 2

; Composer's autoloader resolves long paths constantly; the default 4K cache
; overflows on a Laravel app and every miss becomes another host round trip.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
